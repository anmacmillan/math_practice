<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Quest: Super Star! 🚀</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=VT323&family=Spectral:wght@400;700;800&family=Luckiest+Guy&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            /* Classic Theme */
            --primary: #ff6b6b;
            --primary-dark: #e55b5b;
            --primary-light: #ff8080;
            --secondary: #4ecdc4;
            --secondary-dark: #45b3ab;
            --secondary-light: #65d8d2;
            --success: #54d65b;
            --danger: #ff4757;
            --warning: #ffa500;
            --background: #f7f9fc;
            --container-bg: #ffffff;
            --text-main: #2c3a47;
            --text-light: #95a5a6;
            --font-main: "Nunito", sans-serif;
            --radius: 18px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --xp-bar: #54d65b;
        }

        /* Hogwarts Theme */
        [data-theme="hogwarts"] {
            --primary: #740001;
            /* Gryffindor Red */
            --primary-dark: #5a0001;
            --primary-light: #9e1a1a;
            --secondary: #D3A625;
            /* Gryffindor Gold */
            --secondary-dark: #b08d1f;
            --secondary-light: #e6c15c;
            --background: #111111;
            --container-bg: #222222;
            --text-main: #f0e6d2;
            --text-light: #b0a080;
            --font-main: "Spectral", serif;
            --xp-bar: #D3A625;
            --shadow: 0 0 20px rgba(211, 166, 37, 0.2);
        }

        /* Minecraft Theme */
        [data-theme="minecraft"] {
            --primary: #5AA33E;
            /* Grass */
            --primary-dark: #3e702b;
            --primary-light: #7cd058;
            --secondary: #866043;
            /* Dirt */
            --secondary-dark: #634530;
            --secondary-light: #a67c5b;
            --background: #a5d6a7;
            --container-bg: #c6c6c6;
            --text-main: #333333;
            --text-light: #555555;
            --font-main: "VT323", monospace;
            --radius: 0px;
            --xp-bar: #3ae23a;
            --shadow: 4px 4px 0px rgba(0, 0, 0, 0.3);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: background var(--transition);
            overflow-x: hidden;
        }

        /* Theme Specific Body Backgrounds */
        [data-theme="hogwarts"] body {
            background-image:
                radial-gradient(circle at 20% 20%, rgba(116, 0, 1, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(211, 166, 37, 0.1) 0%, transparent 40%);
        }

        [data-theme="minecraft"] body {
            background-image: url('https://www.transparenttextures.com/patterns/pixel-weave.png');
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: auto;
            padding: 30px;
            background: var(--container-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all var(--transition);
        }

        [data-theme="minecraft"] .container {
            border: 4px solid #333;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }

        [data-theme="minecraft"] h1 {
            font-size: 4rem;
            text-transform: uppercase;
        }

        [data-theme="hogwarts"] h1 {
            font-family: 'Spectral', serif;
            font-variant: small-caps;
            letter-spacing: 2px;
            color: var(--secondary);
        }

        /* XP Bar */
        .xp-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .xp-bar-outer {
            flex-grow: 1;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
            margin: 0 15px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .xp-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--xp-bar);
            transition: width 0.5s ease-out;
            box-shadow: 0 0 10px var(--xp-bar);
        }

        .level-text {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--xp-bar);
            min-width: 80px;
            text-align: center;
        }

        /* Screens */
        .screen {
            display: none;
            text-align: center;
        }

        .screen.active {
            display: block;
            animation: slideUp 0.5s var(--transition);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Buttons */
        .btn {
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all var(--transition);
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 0 var(--primary-dark), 0 8px 15px rgba(0, 0, 0, 0.1);
            margin: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 0 var(--primary-dark), 0 12px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 0 var(--primary-dark), 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            box-shadow: 0 4px 0 var(--secondary-dark), 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="minecraft"] .btn {
            border: 4px solid #333;
            box-shadow: 4px 4px 0 #333;
            border-radius: 0;
        }

        [data-theme="minecraft"] .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #333;
        }

        [data-theme="minecraft"] .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #333;
        }

        /* Problem Display */
        .problem-card {
            font-size: 5rem;
            font-family: inherit;
            margin: 40px 0;
            padding: 40px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: var(--radius);
            position: relative;
            display: inline-block;
            min-width: 300px;
            transition: all var(--transition);
        }

        [data-theme="hogwarts"] .problem-card {
            background: url('https://www.transparenttextures.com/patterns/papyros.png');
            color: var(--text-main);
            border: 3px double var(--secondary);
            box-shadow: 0 0 30px rgba(211, 166, 37, 0.15);
        }

        [data-theme="minecraft"] .problem-card {
            background: #866043;
            color: white;
            border: 4px solid #333;
            font-family: "VT323", monospace;
        }

        /* Input */
        .answer-input {
            font-size: 3rem;
            font-weight: 900;
            width: 200px;
            text-align: center;
            padding: 20px;
            border: 4px solid var(--secondary);
            border-radius: var(--radius);
            background: var(--container-bg);
            color: var(--text-main);
            outline: none;
            transition: all var(--transition);
        }

        .answer-input:focus {
            border-color: var(--primary);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
        }

        /* Stats Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin: 20px 0;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 6px;
            color: white;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .box-0 {
            background: #fee2e2;
            color: #991b1b;
        }

        .box-1 {
            background: #fca5a5;
        }

        .box-2 {
            background: #f87171;
        }

        .box-3 {
            background: #4ecdc4;
        }

        .box-4 {
            background: #54d65b;
            box-shadow: 0 0 8px rgba(84, 214, 91, 0.5);
        }

        .box-na {
            background: #e5e7eb;
            color: #9ca3af;
        }

        /* Stylized Theme Buttons */
        .theme-switcher {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .theme-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: 800;
            transition: all var(--transition);
            background: var(--container-bg);
            box-shadow: var(--shadow);
            color: var(--text-main);
        }

        .theme-btn:hover {
            transform: translateY(-5px);
        }

        .theme-btn.active {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.1);
        }

        .theme-btn[onclick*="hogwarts"] {
            font-family: 'Spectral', serif;
            color: #D3A625;
            background: #740001;
            border: 2px solid #D3A625;
        }

        .theme-btn[onclick*="minecraft"] {
            font-family: 'VT323', monospace;
            color: #fff;
            background: #5AA33E;
            border: 2px solid #3e702b;
            text-transform: uppercase;
        }

        .theme-btn[onclick*="hogwarts"].active {
            box-shadow: 0 0 20px #D3A625;
        }

        .theme-btn[onclick*="minecraft"].active {
            box-shadow: 0 0 20px #5AA33E;
        }

        /* Feedback Overlay */
        .feedback-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 1000;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .feedback-overlay.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Helpers */
        .hidden {
            display: none !important;
        }

        /* Mobile */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .problem-card {
                font-size: 3rem;
                padding: 20px;
            }

            .answer-input {
                font-size: 2rem;
                width: 140px;
            }

            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .active_table {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
            border: 3px solid var(--secondary) !important;
            box-shadow: 0 0 15px var(--primary) !important;
            transform: scale(1.1);
        }
    </style>
</head>

<body data-theme="hogwarts">

    <div class="theme-switcher">
        <button class="theme-btn active" onclick="setTheme('hogwarts')" title="Hogwarts Theme">Hogwarts</button>
        <button class="theme-btn" onclick="setTheme('minecraft')" title="Minecraft Theme">Minecraft</button>
    </div>

    <div class="container">
        <header>
            <h1 id="title-text">Times Tables!</h1>
            <p id="subheading-text">Master your magic numbers 🌟</p>
        </header>

        <!-- Start Screen -->
        <section id="start-screen" class="screen active">
            <h2>Prepare for Quest!</h2>
            <div style="margin: 20px 0;">
                <p>Which tables to practice?</p>
                <div id="table-select"
                    style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 15px 0;">
                    <!-- JS populated -->
                </div>
            </div>
            <div>
                <button onclick="startPractice()" class="btn">Start Adventure! ⚔️</button>
            </div>
            <div style="margin-top: 20px;">
                <button onclick="showScreen('stats')" class="btn btn-secondary">My Progress 🏆</button>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div id="streak-display" style="font-weight: 900; font-size: 1.2rem; color: var(--primary);">Streak: 🔥
                    0</div>
                <div id="timer-display" style="font-weight: 700;">Time: 0s</div>
            </div>

            <div id="problem" class="problem-card">7 × 8</div>

            <form id="answer-form" autocomplete="off">
                <input type="number" id="answer-input" class="answer-input" inputmode="numeric" autofocus />
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn">CHECK! ✨</button>
                </div>
            </form>
        </section>

        <!-- End Screen -->
        <section id="end-screen" class="screen">
            <h2 id="end-title">Quest Complete!</h2>
            <div id="summary" style="font-size: 1.5rem; margin: 20px 0;"></div>
            <div id="xp-gain" style="font-size: 2rem; font-weight: 900; color: var(--success); margin: 20px 0;">+0 XP
            </div>
            <button onclick="showScreen('start')" class="btn">Play Again! 🔄</button>
            <button onclick="showScreen('stats')" class="btn btn-secondary">Full Stats 📊</button>
        </section>

        <!-- Stats Screen -->
        <section id="stats-screen" class="screen">
            <button onclick="showScreen('start')" class="btn btn-secondary" style="margin-bottom: 20px;">🏠 Back
                Home</button>
            <h2>Your Knowledge Map</h2>
            <div id="stats-grid" class="grid"></div>
            <div
                style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; font-size: 0.8rem; margin-top: 20px;">
                <span>🟥 Learning</span>
                <span>🟨 Getting There</span>
                <span>🟩 Mastered!</span>
            </div>
        </section>
    </div>

    <!-- XP Bar -->
    <div class="xp-container">
        <div class="level-text" id="level-display">LVL 1</div>
        <div class="xp-bar-outer">
            <div id="xp-bar-fill" class="xp-bar-inner"></div>
        </div>
        <div class="level-text" id="xp-text">0 / 100 XP</div>
    </div>

    <div id="feedback-overlay" class="feedback-overlay">YES! 💥</div>

    <script>
        // --- Constants & Config ---
        const DELAYS = [0, 1, 3, 7, 15]; // Spaced repetition days
        const XP_PER_CORRECT = 10;
        const XP_STREAK_BONUS = 5;
        const XP_FAST_BONUS = 5; // < 3 seconds
        const QUESTIONS_PER_ROUND = 20;

        // --- State ---
        let state = {
            stats: JSON.parse(localStorage.getItem('tt_stats') || '{}'),
            xp: parseInt(localStorage.getItem('tt_xp') || '0'),
            theme: localStorage.getItem('tt_theme') || 'hogwarts',
            currentStreak: 0,
            asked: 0,
            correct: 0,
            roundQueue: [],
            currentProblem: null,
            startTime: null,
            timerInterval: null
        };

        const THEMES = {
            hogwarts: { title: "Arithmancy Class", sub: "Earn points for your House! 🧙", correct: ["Brilliant!", "10 Points!", "Magic!", "✨"], incorrect: ["Expelliarmus!", "Not quite...", "📜"] },
            minecraft: { title: "Math Craft", sub: "Don't let the Creepers win! 💎", correct: ["Loot!", "Epic!", "Critical Hit!", "⛏️"], incorrect: ["Ouch!", "Sizzzzze...", "📦"] }
        };

        // --- Init ---
        function init() {
            setTheme(state.theme);
            renderTableSelect();
            updateXPBar();

            document.getElementById('answer-form').onsubmit = (e) => {
                e.preventDefault();
                checkAnswer();
            };
        }

        function renderTableSelect() {
            const container = document.getElementById('table-select');
            // Store current active states if we are re-rendering
            const currentActive = new Set();
            container.querySelectorAll('.active_table').forEach(b => currentActive.add(b.id.split('-')[1]));
            
            container.innerHTML = '';
            for (let i = 2; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn btn-secondary';
                btn.style.padding = '10px 20px';
                btn.textContent = `${i}×`;
                btn.onclick = () => btn.classList.toggle('active_table');
                btn.id = `table-${i}`;
                
                // Default selection (2x-5x) or restore previous
                if (currentActive.size > 0) {
                    if (currentActive.has(String(i))) btn.classList.add('active_table');
                } else if (i <= 5) {
                    btn.classList.add('active_table');
                }
                
                container.appendChild(btn);
            }
        }

        function setTheme(t) {
            state.theme = t;
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('tt_theme', t);

            const config = THEMES[t];
            if (config) {
                document.getElementById('title-text').textContent = config.title;
                document.getElementById('subheading-text').textContent = config.sub;
            }

            // Sync theme buttons active state
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(`'${t}'`)) {
                    btn.classList.add('active');
                }
            });
            
            // Re-render table selection to apply potential theme-specific colors
            renderTableSelect();
        }

        // --- Game Logic ---
        function startPractice() {
            console.log("Starting Adventure...");
            const selected = [];
            for (let i = 2; i <= 10; i++) {
                const el = document.getElementById(`table-${i}`);
                if (el && el.classList.contains('active_table')) {
                    selected.push(i);
                }
            }

            if (selected.length === 0) {
                alert("Select at least one table!");
                return;
            }

            state.asked = 0;
            state.correct = 0;
            state.currentStreak = 0;
            state.roundQueue = buildQueue(selected);

            showScreen('game');
            nextQuestion();
            startTimer();
        }

        function buildQueue(tables) {
            let pool = [];
            tables.forEach(t => {
                for (let b = 1; b <= 10; b++) pool.push([t, b]);
            });

            // Ensure we have enough questions to fill the round
            let q = [];
            while (q.length < QUESTIONS_PER_ROUND) {
                // Shuffle the pool each time we add it to keep it random
                const shuffledPool = [...pool].sort(() => Math.random() - 0.5);
                q = q.concat(shuffledPool);
            }

            return q.slice(0, QUESTIONS_PER_ROUND);
        }

        function nextQuestion() {
            if (state.asked >= QUESTIONS_PER_ROUND) return finishGame();

            state.currentProblem = state.roundQueue[state.asked];
            const [a, b] = state.currentProblem;

            const problemEl = document.getElementById('problem');
            problemEl.textContent = `${a} × ${b}`;
            problemEl.style.animation = 'none';
            problemEl.offsetHeight; // trigger reflow
            problemEl.style.animation = 'slideUp 0.4s ease';

            const input = document.getElementById('answer-input');
            input.value = '';
            input.focus();

            state.problemStartTime = Date.now();
        }

        function checkAnswer() {
            const input = document.getElementById('answer-input');
            const val = parseInt(input.value);
            const [a, b] = state.currentProblem;
            const correctAns = a * b;

            const isCorrect = val === correctAns;
            const timeTaken = (Date.now() - state.problemStartTime) / 1000;

            if (isCorrect) {
                state.correct++;
                state.currentStreak++;

                // XP Calculation
                let earned = XP_PER_CORRECT;
                if (state.currentStreak >= 5) earned += XP_STREAK_BONUS;
                if (timeTaken < 3) earned += XP_FAST_BONUS;
                addXP(earned);

                showFeedback(true);
                updateStats(a, b, true);

                if (state.currentStreak % 10 === 0) fireConfetti();
            } else {
                state.currentStreak = 0;
                showFeedback(false, correctAns);
                updateStats(a, b, false);
                // Shake effect
                document.getElementById('problem').style.animation = 'shake 0.3s';
            }

            state.asked++;
            updateUI();

            setTimeout(nextQuestion, isCorrect ? 800 : 2000);
        }

        function showFeedback(success, correctVal) {
            const overlay = document.getElementById('feedback-overlay');
            const pool = success ? THEMES[state.theme].correct : THEMES[state.theme].incorrect;
            const msg = pool[Math.floor(Math.random() * pool.length)];

            overlay.textContent = success ? msg : `${msg} (${state.currentProblem[0]}×${state.currentProblem[1]}=${correctVal})`;
            overlay.style.color = success ? 'var(--success)' : 'var(--danger)';
            overlay.classList.add('show');

            setTimeout(() => overlay.classList.remove('show'), 1200);

            // Audio Feedback (Synthesized)
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (success) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            }
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        function finishGame() {
            stopTimer();
            showScreen('end');

            const accuracy = Math.round((state.correct / state.asked) * 100);
            document.getElementById('summary').textContent = `You got ${state.correct} out of ${state.asked} right! (${accuracy}%)`;

            // Final XP Bonus
            if (accuracy >= 90) {
                addXP(50);
                document.getElementById('xp-gain').textContent = "+50 Perfect Bonus! 🏆";
                fireConfetti();
            } else {
                document.getElementById('xp-gain').textContent = "";
            }
        }

        // --- XP & Progression ---
        function addXP(amount) {
            state.xp += amount;
            localStorage.setItem('tt_xp', state.xp);
            updateXPBar();
        }

        function updateXPBar() {
            const level = Math.floor(state.xp / 100) + 1;
            const xpInLevel = state.xp % 100;

            document.getElementById('level-display').textContent = `LVL ${level}`;
            document.getElementById('xp-text').textContent = `${xpInLevel} / 100 XP`;
            document.getElementById('xp-bar-fill').style.width = `${xpInLevel}%`;

            // Level up check
            const oldLevel = parseInt(document.getElementById('level-display').dataset.old || "1");
            if (level > oldLevel) {
                fireConfetti();
                // Show Level Up popup?
            }
            document.getElementById('level-display').dataset.old = level;
        }

        // --- Utils ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`${id}-screen`).classList.add('active');
            if (id === 'stats') renderStatsGrid();
        }

        function updateUI() {
            document.getElementById('streak-display').textContent = `Streak: 🔥 ${state.currentStreak}`;
        }

        function startTimer() {
            state.startTime = Date.now();
            state.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                document.getElementById('timer-display').textContent = `Time: ${elapsed}s`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
        }

        function updateStats(a, b, correct) {
            const key = `${a}x${b}`;
            const meta = state.stats[key] || { box: 0, attempts: 0, correct: 0 };

            meta.attempts++;
            if (correct) {
                meta.correct++;
                meta.box = Math.min(meta.box + 1, 4);
            } else {
                meta.box = 0;
            }
            state.stats[key] = meta;
            localStorage.setItem('tt_stats', JSON.stringify(state.stats));
        }

        function renderStatsGrid() {
            const grid = document.getElementById('stats-grid');
            grid.innerHTML = '';
            for (let a = 2; a <= 10; a++) {
                for (let b = 1; b <= 10; b++) {
                    const key = `${a}x${b}`;
                    const meta = state.stats[key];
                    const cell = document.createElement('div');
                    cell.className = 'cell ' + (meta ? `box-${meta.box}` : 'box-na');
                    cell.textContent = `${a}×${b}`;
                    grid.appendChild(cell);
                }
            }
        }

        function fireConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: state.theme === 'minecraft' ? ['#5AA33E', '#866043', '#ffffff'] :
                    state.theme === 'hogwarts' ? ['#740001', '#D3A625', '#000000'] : null
            });
        }

        // Add shake animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        init();
    </script>
</body>

</html>
